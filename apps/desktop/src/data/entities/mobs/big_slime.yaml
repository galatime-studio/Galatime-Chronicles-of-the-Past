name: Big Slime
rarity: uncommon
height: "120 cm"
weight: "80 kg"
description: >
  A large gelatinous creature that can be found in various environments.
  Despite their simple appearance, big slimes are surprisingly resilient.

elements:
  - aqua

base_stats:
  hp: 445
  mana: 25
  stamina: 31
  physical_attack: 25
  magical_attack: 28
  physical_defense: 18
  magical_defense: 41
  speed: 20

skills:
  - id: headbutt_II
    name: Headbutt II
    description: "The big slime crashes its bulk forward; one physical hit deals power 11 at 95% accuracy."
    element_id: corporis
    kind: attack
    targeting: any_one
    range: short
    damage:
      kind: physical
      damage_type: physical
      power: { kind: fixed, value: 11 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 0, stamina: 6, cooldown: 0 }

  - id: splash_III
    name: Splash III
    description: "A crashing wave of gel deals power 14 magical damage at 95% accuracy and leaves the target Wet for 5 turns."
    element_id: aqua
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 14 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 6, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: splash_wet
        status_effect: Wet
        apply_to: target
        turns: 5
        polarity: positive
        element_modulation:
          ignis: 0.25
          aqua: 2
          chaos: 2
        expire_on_elements: [ignis]

weapon: 

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: slime_goo
    quantity: 1
    chance: 0.8

abilities:
  - id: gelatinous_body
    name: Gelatinous Body
    description: Physical attacks lose 90% of their power against it.
    tags: [defense, physical]
    trigger:
      event: before_damage
    condition:
      all:
        - damage:
            type: physical
            operator: eq
    action:
      type: modify_damage
      target: self
      parameters:
        multiplier: 0.1
    display:
      visible: true
      priority: 80

  - id: slime_split
    name: Slime Split
    description: When it dies, it bursts into 2 Slimes.
    tags: [death, summon]
    trigger:
      event: on_death
    action:
      type: summon
      target: self
      parameters:
        entity_id: slime
        entity_type: mob
        count: 2
    display:
      visible: true
      priority: 70

ai:
  style: brute
  weights:
    kill_secure: 2.5
    survival: 0.1
  thresholds:
    wounded: 0.2
  targeting:
    prefer: [weakest]
  pace: 1200


