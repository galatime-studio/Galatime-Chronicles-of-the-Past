name: Hopper
rarity: common
height: "45 cm"
weight: "8 kg"
description: >
  A small, agile creature that hops around. They seem to only
  attack to defend their babies... I feel bad for them...

elements:
  - corporis

base_stats:
  hp: 36
  mana: 8
  stamina: 32
  physical_attack: 38
  magical_attack: 10
  physical_defense: 25
  magical_defense: 7
  speed: 37

skills:
  - id: headbutt
    name: Headbutt
    description: "The hopper springs headfirst into its target; one physical hit deals power 8 at 95% accuracy."
    element_id: corporis
    kind: attack
    targeting: any_one
    range: short
    damage:
      kind: physical
      damage_type: physical
      power: { kind: fixed, value: 8 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 0, stamina: 4, cooldown: 0 }

weapon:

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: hopper_leg
    quantity: 1
    chance: 0.2
  - item_id: dirty_fur
    quantity: 1
    chance: 0.8

ai:
  style: brute
  # A cornered hopper runs for its babies rather than die for the fight.
  flee:
    below_hp: 0.25


