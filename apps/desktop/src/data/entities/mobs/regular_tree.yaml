name: Regular Tree
rarity: uncommon
height: "280 cm"
weight: "420 kg"
description: >
  There is nothing regular about this tree. Beside it moving,
  it throws explosive apples, and summons flowerlings to fight...
  I will give it credit, it has some sick moves.

elements:
  - florere
  - chaos

base_stats:
  hp: 736
  mana: 22
  stamina: 39
  physical_attack: 43
  magical_attack: 24
  physical_defense: 55
  magical_defense: 31
  speed: 8

skills:
  - id: explosive_apples
    name: Explosive Apples
    description: "A ripe apple bursts against the target for power 12 magical damage at 90% accuracy, splashing 40% of the hit onto its neighbours 60% of the time."
    element_id: chaos
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 12 }
    damage_variance: [0.75, 1.25]
    accuracy: 90
    hit_count: 1
    costs: { mana: 7, stamina: 0, cooldown: 0 }
    collateral: { damage_multiplier: 0.4, chance: 0.6, include_primary_targets: false }

  - id: apple_party
    name: Apple Party
    description: "A rain of explosive apples falls on every enemy for power 9 magical damage at 85% accuracy."
    element_id: chaos
    kind: attack
    targeting: enemies_all
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 9 }
    damage_variance: [0.8, 1.2]
    accuracy: 85
    hit_count: 1
    costs: { mana: 10, stamina: 0, cooldown: 0 }

weapon: 

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: sweet_pollen
    quantity: 1
    chance: 0.45

abilities:
  - id: seed_flowerling
    name: Seed Flowerling
    description: After 3 of its turns, it grows a Flowerling.
    tags: [summon]
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 3
    action:
      type: summon
      target: self
      parameters:
        entity_id: flowerling
        entity_type: mob
        count: 1
    display:
      visible: true
      priority: 60

ai:
  style: brute
  weights:
    reposition: 0.0
  pace: 1000