name: Pure Soul
rarity: epic
height: "140 cm"
weight: "0 kg"
description: >
  A soul refined into radiant serenity. Its light shields companions,
  restores vitality, and turns any attack back on the attacker.

elements:
  - lux

base_stats:
  hp: 470
  mana: 90
  stamina: 30
  physical_attack: 68
  magical_attack: 25
  physical_defense: 40
  magical_defense: 72
  speed: 39

skills:
  - id: lightness_III
    name: Lightness III
    description: "A radiant uplift carries every ally: +14 SPD and +8 Evasion for 4 turns."
    element_id: lux
    kind: buff
    targeting: allies_all
    costs: { mana: 6, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: lightness
        status_effect: Lightness
        apply_to: allies_all
        turns: 4
        polarity: positive
        buff: { speed: 14, evasion: 8 }

  - id: angel_guard_II
    name: Angel Guard II
    description: "A stronger guardian light covers every ally for 3 turns: a shield worth 25% of max HP and +9 PDEF/MDEF."
    element_id: lux
    kind: buff
    targeting: allies_all
    costs: { mana: 9, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: angel_guard
        status_effect: Angel Guard
        apply_to: allies_all
        turns: 3
        polarity: positive
        shield: { percent_of_max_hp: 25 }
        buff: { physical_defense: 9, magical_defense: 9 }

  - id: soul_mend_III
    name: Soul Mend III
    description: "A radiant pulse of light restores 34 HP to every ally."
    element_id: lux
    kind: heal
    targeting: allies_all
    costs: { mana: 9, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: soul_mend_effect
        status_effect: Soul Mend
        apply_to: allies_all
        turns: 1
        heal: 34
        polarity: positive

loot:
  - item_id: gold_coin
    quantity: 3
    chance: 0.65

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns back into a Corrupted Soul.
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: corrupted_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

  - id: radiant_reflection
    name: Radiant Reflection
    description: Any attack is partly thrown back at the attacker.
    trigger:
      event: after_damage
    action:
      type: reflect_damage
      target: attacker
      parameters:
        fraction: 0.4
        accuracy: 60
    display:
      visible: true
      priority: 50

ai:
  style: support
