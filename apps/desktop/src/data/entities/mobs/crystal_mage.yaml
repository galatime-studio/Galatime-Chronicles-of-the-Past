name: Crystal Mage
rarity: common
height: "90 cm"
weight: "35 kg"
description: >
  A crystal that has gained sentience and hostility towards all
  living things. I asked the others where do these things gain
  their sentience and they told me about an urban legend about
  how crystal mages are the souls of people that died buried
  alive...

elements:
  - lapis

base_stats:
  hp: 315
  mana: 75
  stamina: 22
  physical_attack: 36
  magical_attack: 73
  physical_defense: 14
  magical_defense: 35
  speed: 24

skills:
  - id: rock_thorns
    name: Rock Thorns
    description: "Jagged stone spikes rise for 3 turns: +10 PDEF, and attackers suffer 10 physical damage for up to 3 reflections."
    element_id: lapis
    kind: buff
    targeting: self
    costs: { mana: 8, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: rock_thorns
        status_effect: Rock Thorns
        apply_to: self
        turns: 3
        polarity: positive
        buff: { physical_defense: 10 }
        reflect: { power: 10, chance: 1, consume: false, charges: 3 }

  - id: rock_sheets
    name: Rock Sheets
    description: "Sheets of stone fold over the caster for 3 turns: a shield worth 25% of max HP and 25% less physical damage taken."
    element_id: lapis
    kind: buff
    targeting: self
    costs: { mana: 10, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: rock_sheets
        status_effect: Rock Sheets
        apply_to: self
        turns: 3
        polarity: positive
        shield: { percent_of_max_hp: 25 }
        damage_channel_modulation: { physical: 0.75 }

weapon:

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: crystal_shard
    quantity: 1
    chance: 0.8

ai:
  style: caster
  weights:
    element_edge: 0.8
  thresholds:
    rest_mana: 0.3
    guard_mana: 0.2


