name: Corrupted Soul
rarity: epic
height: "140 cm"
weight: "0 kg"
description: >
  A soul consumed by endless avarice. Its touch withers resolve, and
  its hunger feeds on any fading spark nearby.

elements:
  - umbra

base_stats:
  hp: 500
  mana: 85
  stamina: 30
  physical_attack: 28
  magical_attack: 72
  physical_defense: 46
  magical_defense: 38
  speed: 47

skills:
  - id: darkness_III
    name: Darkness III
    description: "A void-black shroud smothers the target: ACC −20% and Evasion −8 for 3 turns."
    element_id: umbra
    kind: control
    targeting: any_one
    range: medium
    costs: { mana: 4, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: darkness_effect
        status_effect: Darkness
        apply_to: target
        turns: 3
        polarity: negative
        debuff: { accuracy: 20, evasion: 8 }

  - id: dark_ball_II
    name: Dark Ball II
    description: "A denser sphere of devouring shadow deals power 14 magical damage at 95% accuracy and ignores 10% of the target's defence."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 14 }
    accuracy: 95
    hit_count: 1
    defense_pierce: 0.1
    costs: { mana: 6, stamina: 0, cooldown: 0 }

loot:
  - item_id: gold_coin
    quantity: 3
    chance: 0.65

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns into a Pure Soul.
    tags: [transform, cycle]
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: pure_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

ai:
  style: caster
  targeting:
    prefer: [weakest]
