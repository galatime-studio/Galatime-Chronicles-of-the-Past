name: Corrupted Soul
rarity: epic
height: "140 cm"
weight: "0 kg"
description: >
  A soul consumed by endless avarice. Its hunger drains the life from
  every nearby spark to sustain its own withering form.

elements:
  - umbra

base_stats:
  hp: 500
  mana: 85
  stamina: 30
  physical_attack: 28
  magical_attack: 72
  physical_defense: 46
  magical_defense: 38
  speed: 47

skills:
  - id: soul_drain_III
    name: Soul Drain III
    description: "Rends life from a target: power 20 magical damage at 95% accuracy, healing the caster for 55% of the damage dealt."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 20 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 7, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: soul_drain_effect
        status_effect: Soul Drain
        apply_to: target
        turns: 1
        polarity: negative
        drain_percent_of_damage: 0.55

  - id: soul_tide
    name: Soul Tide
    description: "A tide of hungry shadow washes over every enemy: power 12 magical damage at 95% accuracy, healing the caster for 35% of the damage dealt."
    element_id: umbra
    kind: attack
    targeting: enemies_all
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 12 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 11, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: soul_tide_effect
        status_effect: Soul Tide
        apply_to: target
        turns: 1
        polarity: negative
        drain_percent_of_damage: 0.35

loot:
  - item_id: gold_coin
    quantity: 3
    chance: 0.65

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns into a Pure Soul.
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: pure_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

ai:
  style: caster
  targeting:
    prefer: [weakest]
