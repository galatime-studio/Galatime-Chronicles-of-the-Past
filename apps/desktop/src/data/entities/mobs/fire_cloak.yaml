name: Fire Cloak
rarity: rare
height: "170 cm"
weight: "25 kg"
description: >
  Besides being a living fire, this creature also wears a cloak
  that doesn't burn.

elements:
  - ignis

base_stats:
  hp: 264
  mana: 47
  stamina: 8
  physical_attack: 40
  magical_attack: 70
  physical_defense: 29
  magical_defense: 39
  speed: 50

skills:
  - id: fire_ball
    name: Fire Ball
    description: "A hurled ball of living flame deals power 12 magical damage at 95% accuracy and has a 35% chance to leave 1 Burn stack for 2 turns."
    element_id: ignis
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 12 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 5, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: fire_ball_burn
        status_effect: Burn
        apply_to: target
        turns: 2
        polarity: negative
        effect_hit_chance: 0.35
        damage_per_turn: 4
        damage_timing: turn_end
        stacking: { initial: 1, extend_turns: 1 }
        expire_on_elements: [aqua, caeli]

  - id: comet_dash
    name: Comet Dash
    description: "The cloak streaks across the field to the front line, striking for power 16 physical damage at 90% accuracy."
    element_id: ignis
    kind: attack
    targeting: any_one
    range: short
    damage:
      kind: physical
      damage_type: physical
      power: { kind: fixed, value: 16 }
    accuracy: 90
    hit_count: 1
    costs: { mana: 2, stamina: 6, cooldown: 0 }
    effects:
      - effect_id: comet_dash_move
        apply_to: self
        move: { who: self, to_line: front }

weapon:

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: crimson_coal
    quantity: 1
    chance: 0.2
  - item_id: warm_rag
    quantity: 1
    chance: 0.9

abilities:
  - id: kindled_immunity
    name: Kindled Immunity
    description: The first physical hit ignites it, making it immune to physical attacks until it dies.
    tags: [reaction, immunity]
    trigger:
      event: after_damage
      once: true
    condition:
      all:
        - damage:
            type: physical
            operator: eq
    action:
      type: set_immunity
      target: self
      parameters:
        damage_type: physical
    display:
      visible: true
      priority: 80

  - id: kindled_haste
    name: Kindled Haste
    description: The first physical hit also stokes its flames, raising its speed until it dies.
    tags: [reaction, buff]
    trigger:
      event: after_damage
      once: true
    condition:
      all:
        - damage:
            type: physical
            operator: eq
    action:
      type: modify_stat
      target: self
      parameters:
        stat_changes:
          speed: 20
    duration:
      type: until_death
    display:
      visible: true
      priority: 70

ai:
  style: caster
  weights:
    element_edge: 0.8
