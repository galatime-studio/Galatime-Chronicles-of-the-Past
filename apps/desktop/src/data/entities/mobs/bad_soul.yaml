name: Bad Soul
rarity: rare
height: "128 cm"
weight: "0 kg"
description: >
  A greedy soul that has abandoned all restraint. It tears at life
  energy with ruthless hunger and grows stronger with every theft.

elements:
  - umbra

base_stats:
  hp: 360
  mana: 60
  stamina: 24
  physical_attack: 20
  magical_attack: 56
  physical_defense: 35
  magical_defense: 28
  speed: 42

skills:
  - id: darkness_II
    name: Darkness II
    description: "A thicker black mist smothers the target: ACC −15% and Evasion −5 for 2 turns."
    element_id: umbra
    kind: control
    targeting: any_one
    range: medium
    costs: { mana: 3, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: darkness_effect
        status_effect: Darkness
        apply_to: target
        turns: 2
        polarity: negative
        debuff: { accuracy: 15, evasion: 5 }

  - id: dark_ball
    name: Dark Ball
    description: "A sphere of devouring shadow deals power 10 magical damage at 95% accuracy."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 10 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 4, stamina: 0, cooldown: 0 }

loot:
  - item_id: gold_coin
    quantity: 2
    chance: 0.55

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns into a Good Soul.
    tags: [transform, cycle]
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: good_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

ai:
  style: caster
  targeting:
    prefer: [weakest]