name: Bad Soul
rarity: rare
height: "128 cm"
weight: "0 kg"
description: >
  A greedy soul that has abandoned all restraint. It tears at life
  energy with ruthless hunger, mending its own wounds with every theft.

elements:
  - umbra

base_stats:
  hp: 360
  mana: 60
  stamina: 24
  physical_attack: 20
  magical_attack: 56
  physical_defense: 35
  magical_defense: 28
  speed: 42

skills:
  - id: soul_drain_II
    name: Soul Drain II
    description: "Tears deeper into a target's life: power 14 magical damage at 95% accuracy, healing the caster for 55% of the damage dealt."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 14 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 5, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: soul_drain_effect
        status_effect: Soul Drain
        apply_to: target
        turns: 1
        polarity: negative
        drain_percent_of_damage: 0.55

  - id: soul_siphon_II
    name: Soul Siphon II
    description: "Draws a greedy draught of life: power 20 magical damage at 95% accuracy, healing the caster for 45% of the damage dealt."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 20 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 8, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: soul_siphon_effect
        status_effect: Soul Siphon
        apply_to: target
        turns: 1
        polarity: negative
        drain_percent_of_damage: 0.45

loot:
  - item_id: gold_coin
    quantity: 2
    chance: 0.55

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns into a Good Soul.
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: good_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

ai:
  style: caster
  targeting:
    prefer: [weakest]