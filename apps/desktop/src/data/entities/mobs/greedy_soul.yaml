name: Greedy Soul
rarity: uncommon
height: "120 cm"
weight: "0 kg"
description: >
  Hollow absorbents of light souls that wander around, draining
  the life force of others to mend their own wounds. I hope these
  things aren't actual souls...

elements:
  - umbra

base_stats:
  hp: 250
  mana: 40
  stamina: 18
  physical_attack: 14
  magical_attack: 42
  physical_defense: 28
  magical_defense: 18
  speed: 38

skills:
  - id: soul_drain
    name: Soul Drain
    description: "Tears life from a target: power 10 magical damage at 95% accuracy, healing the caster for half the damage dealt."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 10 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 4, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: soul_drain_effect
        status_effect: Soul Drain
        apply_to: target
        turns: 1
        polarity: negative
        drain_percent_of_damage: 0.5

  - id: soul_siphon
    name: Soul Siphon
    description: "Draws a deeper draught of life: power 14 magical damage at 95% accuracy, healing the caster for 40% of the damage dealt."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 14 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 6, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: soul_siphon_effect
        status_effect: Soul Siphon
        apply_to: target
        turns: 1
        polarity: negative
        drain_percent_of_damage: 0.4

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns into a Charitable Soul.
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: charitable_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

ai:
  style: caster
  targeting:
    prefer: [weakest]
