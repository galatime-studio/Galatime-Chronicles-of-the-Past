name: Greedy Soul
rarity: uncommon
height: "120 cm"
weight: "0 kg"
description: >
  Hollow absorvants of light souls that wander around, draining
  the life force of others. I hope these things aren't actual
  souls...

elements:
  - umbra

base_stats:
  hp: 250
  mana: 40
  stamina: 18
  physical_attack: 14
  magical_attack: 42
  physical_defense: 28
  magical_defense: 18
  speed: 38

skills:
  - id: darkness
    name: Darkness
    description: "A black mist smothers the target: ACC −10% for 2 turns."
    element_id: umbra
    kind: control
    targeting: any_one
    range: medium
    costs: { mana: 2, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: darkness_effect
        status_effect: Darkness
        apply_to: target
        turns: 2
        polarity: negative
        debuff: { accuracy: 10 }

  - id: dark_ball
    name: Dark Ball
    description: "A sphere of devouring shadow deals power 10 magical damage at 95% accuracy."
    element_id: umbra
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 10 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 4, stamina: 0, cooldown: 0 }

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4

abilities:
  - id: soul_inversion
    name: Soul Inversion
    description: After 4 of its turns, it turns into a Charitable Soul.
    tags: [transform, cycle]
    trigger:
      event: turn_end
      once: true
    condition:
      all:
        - turn_count:
            operator: gte
            value: 4
    action:
      type: transform
      target: self
      parameters:
        entity_id: charitable_soul
        entity_type: mob
    display:
      visible: true
      priority: 60

ai:
  style: caster
  targeting:
    prefer: [weakest]
