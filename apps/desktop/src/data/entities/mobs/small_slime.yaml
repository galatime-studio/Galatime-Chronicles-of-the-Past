name: Small Slime
rarity: common
height: "20 cm"
weight: "4 kg"
description: >
  A gelatinous creature that can be found in various environments.
  Despite their simple appearance, slimes are surprisingly resilient.

elements:
  - aqua

base_stats:
  hp: 50
  mana: 11
  stamina: 13
  physical_attack: 15
  magical_attack: 20
  physical_defense: 10
  magical_defense: 17
  speed: 68

skills:
  - id: headbutt
    name: Headbutt
    description: "The slime throws its body forward; one physical hit deals power 8 at 95% accuracy."
    element_id: corporis
    kind: attack
    targeting: any_one
    range: short
    damage:
      kind: physical
      damage_type: physical
      power: { kind: fixed, value: 8 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 0, stamina: 4, cooldown: 0 }

  - id: splash
    name: Splash
    description: "A burst of watery gel deals power 7 magical damage at 95% accuracy and leaves the target Wet for 3 turns."
    element_id: aqua
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 7 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 3, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: splash_wet
        status_effect: Wet
        apply_to: target
        turns: 3
        polarity: positive
        element_modulation:
          ignis: 0.25
          aqua: 2
          chaos: 2
        expire_on_elements: [ignis]

weapon: 

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: slime_goo
    quantity: 1
    chance: 0.8

ai:
  style: brute