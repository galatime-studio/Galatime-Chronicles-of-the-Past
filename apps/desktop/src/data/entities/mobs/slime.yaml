name: Slime
rarity: common
height: "40 cm"
weight: "12 kg"
description: >
  A gelatinous creature that can be found in various environments.
  Despite their simple appearance, slimes are surprisingly resilient.

elements:
  - aqua

base_stats:
  hp: 98
  mana: 19
  stamina: 15
  physical_attack: 17
  magical_attack: 25
  physical_defense: 10
  magical_defense: 34
  speed: 37

skills:
  - id: headbutt
    name: Headbutt
    description: "The slime throws its body forward; one physical hit deals power 8 at 95% accuracy."
    element_id: corporis
    kind: attack
    targeting: any_one
    range: short
    damage:
      kind: physical
      damage_type: physical
      power: { kind: fixed, value: 8 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 0, stamina: 4, cooldown: 0 }

  - id: splash_II
    name: Splash II
    description: "A larger burst of watery gel deals power 10 magical damage at 95% accuracy and leaves the target Wet for 4 turns."
    element_id: aqua
    kind: attack
    targeting: any_one
    range: medium
    damage:
      kind: magical
      damage_type: magical
      power: { kind: fixed, value: 10 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 4, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: splash_wet
        status_effect: Wet
        apply_to: target
        turns: 4
        polarity: positive
        element_modulation:
          ignis: 0.25
          aqua: 2
          chaos: 2
        expire_on_elements: [ignis]

weapon: 

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: slime_goo
    quantity: 1
    chance: 0.8

abilities:
  - id: slime_split_small
    name: Slime Split
    description: When it dies, it bursts into 2 Small Slimes.
    tags: [death, summon]
    trigger:
      event: on_death
    action:
      type: summon
      target: self
      parameters:
        entity_id: small_slime
        entity_type: mob
        count: 2
    display:
      visible: true
      priority: 70

ai:
  style: brute


