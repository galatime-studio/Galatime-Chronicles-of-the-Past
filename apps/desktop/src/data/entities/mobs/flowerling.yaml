name: Flowerling
rarity: common
height: "30 cm"
weight: "3 kg"
description: >
  A small, plant-like creature that resembles a flower. They are
  often found in gardens and meadows, and are known for their
  sweet scent.

elements:
  - florere

base_stats:
  hp: 170
  mana: 25
  stamina: 38
  physical_attack: 40
  magical_attack: 10
  physical_defense: 35
  magical_defense: 38
  speed: 20

skills:
  - id: vine
    name: Vine
    description: "A vine coils around the target: SPD −6 and Evasion −6 for 2 turns, and it cannot change lines."
    element_id: florere
    kind: control
    targeting: any_one
    range: medium
    costs: { mana: 4, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: vine_bind
        status_effect: Vined
        apply_to: target
        turns: 2
        polarity: negative
        debuff: { speed: 6, evasion: 6 }
        prevent_actions: [switch_line]

  - id: vine_whip
    name: Vine Whip
    description: "The flowerling lashes with a thorned vine; one physical hit deals power 6 at 95% accuracy."
    element_id: florere
    kind: attack
    targeting: any_one
    range: short
    damage:
      kind: physical
      damage_type: physical
      power: { kind: fixed, value: 6 }
    accuracy: 95
    hit_count: 1
    costs: { mana: 3, stamina: 0, cooldown: 0 }

weapon:

loot:
  - item_id: gold_coin
    quantity: 1
    chance: 0.4
  - item_id: sweet_pollen
    quantity: 1
    chance: 0.8

abilities:
  - id: thorned_body
    name: Thorned Body
    description: Corporis attacks wound the attacker with part of the damage.
    tags: [reaction, reflect]
    trigger:
      event: after_damage
    condition:
      all:
        - element:
            id: corporis
            operator: eq
    action:
      type: reflect_damage
      target: attacker
      parameters:
        fraction: 0.3
        accuracy: 50
    display:
      visible: true
      priority: 50

ai:
  style: brute
