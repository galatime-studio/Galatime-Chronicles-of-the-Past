    description: "The caster encases the target in unyielding permafrost; Applies a long-lasting Freeze effect and prevents the target from gaining SPD buffs for 3 turns."
    element_id: aqua
    sfx: aqua_ice
    learning_cost:
      experience_points: 2
    learning_requirements:
      required_attack_ids:
        - frostbite
    targeting: any_one
    kind: attack
    damage:
      kind: magical
      damage_type: magical
      power:
        kind: fixed
        value: 6
    accuracy: 80
    hit_count: 1
    bonus_vs_status:
      - status: Wet
        multiplier: 1.05
    costs:
      mana: 11
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: rime_bond_effect
        status_effect: Rime Bond
        apply_to: target
        turns: 3
        polarity: negative
        block_stat_buffs:
          - speed
      - effect_id: freezing_effect
        status_effect: Freezing
        apply_to: target
        turns: 3
        polarity: negative
        debuff:
          physical_attack: 3
          speed: 4
          evasion: 3
        prevent_actions:
          - switch_line
        charges:
          max: 3
          initial: 2
          release:
            status_effect: Frozen
            turns: 1
            prevent_actions:
              - attack
              - defend
              - rest
              - inventory
              - switch_line
              - flee
        also_remove_status:
          - Wet
        expire_on_elements:
          - ignis

