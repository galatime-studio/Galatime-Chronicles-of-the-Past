    sfx: aqua_water
    learning_cost:
      experience_points: 4
    learning_requirements:
      required_attack_ids:
        - riptide
    targeting: any_one
    kind: attack
    damage:
      kind: magical
      damage_type: magical
      power:
        kind: fixed
        value: 9
    accuracy: 90
    hit_count: 1
    costs:
      mana: 10
      stamina: 0
      cooldown: 0
