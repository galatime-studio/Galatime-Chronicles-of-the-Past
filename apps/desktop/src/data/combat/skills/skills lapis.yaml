      - effect_id: rough_terrain
        status_effect: Rough Terrain
        apply_to: target
        turns: 4
        polarity: negative
        cost_multiplier: { stamina: 1.3 }

  - id: quicksand
    name: Quicksand
    description: "Turns the enemy lane into sucking sand for four turns: +60% stamina costs, −8 speed and −8 evasion. Entrants are caught too."
    element_id: lapis
    sfx: lapis
    kind: debuff
