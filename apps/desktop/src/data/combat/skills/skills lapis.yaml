skills:
  - id: earth
    name: Earth
    description: "Draws a layer of packed earth around an ally, hardening its guard at the cost of a little speed."
    element_id: lapis
    sfx: lapis
    kind: buff
    learning_requirements: { required_attack_ids: [] }
    learning_cost: { experience_points: 1 }
    targeting: any_one
    costs: { mana: 2, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: earth_guard
        status_effect: Earthen Guard
        apply_to: target
        turns: 6
        polarity: positive
        buff: { physical_defense: 8, magical_defense: 4 }
        debuff: { speed: 2 }

  - id: mud
    name: Mud
    description: "Coats an ally in clinging mud, making new statuses less likely to take hold; an Aqua hit washes it away."
    element_id: lapis
    sfx: lapis
    kind: buff
    learning_requirements: { required_attack_ids: [earth] }
    learning_cost: { experience_points: 2 }
    targeting: any_one
    costs: { mana: 4, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: mud_seal
        status_effect: Mud Seal
        apply_to: target
        turns: 4
        polarity: positive
        status_resist_chance: 0.35
        expire_on_elements: [aqua]
        debuff: { speed: 5 }

  - id: mud_armor
    name: Mud Armor
    description: "Packs wet earth into armour: strong defence, but the bearer cannot change lanes; Aqua strips it away."
    element_id: lapis
    sfx: lapis
    kind: buff
    learning_requirements: { required_attack_ids: [mud] }
    learning_cost: { experience_points: 3 }
    targeting: any_one
    costs: { mana: 8, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: mud_armor
        status_effect: Mud Armor
        apply_to: target
        turns: 4
        polarity: positive
        buff: { physical_defense: 10, magical_defense: 8 }
        debuff: { speed: 14 }
        status_resist_chance: 0.35
        expire_on_elements: [aqua]
        prevent_actions: [switch_line]

  - id: mud_bath
    name: Mud Bath
    description: "Spreads a hardening bath through the caster's lane, shielding allies from new statuses at a small speed cost; Aqua washes each one clean."
    element_id: lapis
    sfx: lapis
    kind: buff
    learning_requirements: { required_attack_ids: [mud] }
    learning_cost: { experience_points: 3 }
    targeting: self
    costs: { mana: 9, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: mud_bath
        status_effect: Mud Bath
        apply_to: allies_lane
        turns: 3
        polarity: positive
        status_resist_chance: 0.3
        expire_on_elements: [aqua]
        debuff: { speed: 4 }

  - id: erosion
    name: Erosion
    description: "Weathers every boon and curse on the target, reducing the magnitude of any new buff or debuff by 40%."
    element_id: lapis
    sfx: lapis
