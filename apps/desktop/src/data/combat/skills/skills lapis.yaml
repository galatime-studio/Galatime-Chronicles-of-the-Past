        status_effect: Clay Doll
        apply_to: target
        turns: 5
        polarity: positive
        intercept: { hits: 1, break_chance: 0.35 }

  - id: clay_sentinel
    name: Clay Sentinel
    description: "A larger clay sentinel intercepts the next two attacks, each with a 30% chance the blow still lands on the bearer."
