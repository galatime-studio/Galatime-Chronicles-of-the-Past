        status_effect: Collapsing Pit
        apply_to: target
        turns: 2
        polarity: negative
        detonate_on_turn:
          power: 15
          turn_skip_chance: 0.5
          include_line: true
          splash_chance: 0.25

  - id: fissure
    name: Fissure
    description: "Cracks the field for four turns. Any entity that changes lanes or is forced to move takes 16 PWR and is trapped for two turns."
