      - effect_id: quicksand_sink
        status_effect: Quicksand
        apply_to: target
        turns: 4
        polarity: negative
        cost_multiplier: { stamina: 1.6 }
        debuff: { speed: 8, evasion: 8 }

  - id: earth_hole
    name: Earth Hole
    description: "Opens a pit under one enemy: light damage and three turns trapped, unable to change lanes or use short-range/Corporis actions."
    element_id: lapis
    sfx: lapis
    kind: control
    learning_requirements: { required_attack_ids: [earth] }
    learning_cost: { experience_points: 3 }
