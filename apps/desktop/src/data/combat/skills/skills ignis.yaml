# Ignis — fire and heat. Base level 1 only; tiers derive from element_id,
# learning_requirements and learning_cost. All skills use sfx: ignis.

skills:
  # Fire branch
  - id: fire
    name: Fire
    description: "The caster empowers an ally's magical attacks with inner flame; MATK +10% for 4 turns."
    element_id: ignis
    sfx: ignis
    kind: buff
    learning_requirements: { required_attack_ids: [] }
    learning_cost: { experience_points: 1 }
    targeting: any_one
    costs: { mana: 2, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: fire
        status_effect: Inner Flame
        apply_to: target
        turns: 4
        polarity: positive
        buff: { magical_attack: 10 }

  - id: ember_dart
    name: Ember Dart
    description: "The caster fires a small ember that deals magical damage to one enemy."
    element_id: ignis
    sfx: ignis
    kind: attack
    learning_requirements: { required_attack_ids: [fire] }
    learning_cost: { experience_points: 1 }
    targeting: any_one
    damage: { kind: magical, damage_type: magical, power: { kind: fixed, value: 6 } }
    accuracy: 100
    hit_count: 1
    costs: { mana: 3, stamina: 0, cooldown: 0 }

  - id: fireball
    name: Fireball
    description: "The caster launches a fireball that deals magical damage to one enemy."
    element_id: ignis
    sfx: ignis
    kind: attack
    learning_requirements: { required_attack_ids: [ember_dart] }
    learning_cost: { experience_points: 2 }
    targeting: any_one
    damage: { kind: magical, damage_type: magical, power: { kind: fixed, value: 14 } }
    accuracy: 95
    hit_count: 1
    costs: { mana: 6, stamina: 0, cooldown: 0 }

  - id: flame_break
    name: Flame Break
    description: "The caster blasts an enemy with fire, dealing magical damage and lowering PDEF and MDEF by 10% for 2 turns."
