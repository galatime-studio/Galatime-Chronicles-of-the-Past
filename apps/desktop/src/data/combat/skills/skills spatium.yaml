    targeting: any_one
    kind: heal
    costs:
      mana: 10
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: rewind_effect
        status_effect: Rewinding
        apply_to: target
        turns: 2
        polarity: positive
        rewind_each_turn:
          turns: 1
          cleanse: true

  - id: deep_rewind
    name: Deep Rewind
    description: "The caster pulls an ally farther back along their own timeline; For 3 turns, restores the target at the start of their turn to their recorded state from 3 turns earlier, including health, resources and statuses; can revive a defeated ally."
    element_id: spatium
