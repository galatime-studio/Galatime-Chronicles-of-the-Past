    description: "The caster traps an enemy in a sluggish rhythm; Inflicts -14 SPD for 3 turns, extends other temporary effects by 1 turn when applied, and delays the target's fatigue recovery by 1 turn."
    element_id: spatium
    sfx: spatium
    learning_cost:
