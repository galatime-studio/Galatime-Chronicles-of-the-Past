        status_effect: Suspended Harm
        apply_to: target
        turns: 4
        polarity: negative
        echo_mark:
          percent: 100
          resolve: deferred
          delay_turns: 3
          defer_statuses: true

  - id: rewind
    name: Rewind
    description: "The caster draws an ally back to a recent, safer moment; For 2 turns, restores the target at the start of their turn to their recorded state from 1 turn earlier, including health, resources and statuses; can revive a defeated ally."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
