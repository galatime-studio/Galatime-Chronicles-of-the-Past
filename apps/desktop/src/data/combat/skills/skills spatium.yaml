  - id: ambush_phase
    name: Ambush Phase
    description: "The caster slips through space and prepares to strike from the opening; For 1 turn, evades the next direct attack and reappears in a free position in the same lane; area attacks still hit. For 3 turns, if in the front lane, their next attack deals +30% damage."
