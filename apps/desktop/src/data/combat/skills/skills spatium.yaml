        status_effect: Delayed Echo
        apply_to: target
        turns: 2
        polarity: negative
        echo_mark:
          percent: 35
          resolve: caster_next_turn
          can_crit: false

  - id: suspended_harm
    name: Suspended Harm
    description: "The caster seals an enemy's next wound inside a delayed moment; Marks the target for 1 turn. Damage and status effects from the next hit are deferred for 3 turns, then applied together; the mark lasts 3 turns and is consumed when triggered."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
        - echo_mark
    targeting: any_one
    kind: utility
    costs:
