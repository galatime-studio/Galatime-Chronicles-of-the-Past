    targeting: any_one
    kind: debuff
    costs:
      mana: 10
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: stolen_rest_effect
        status_effect: Stolen Rest
        apply_to: target
        turns: 3
        polarity: negative
        debuff:
          speed: 14
        shift_other_effects:
          turns: 1
          direction: extend
          polarity: any
        fatigue_recovery_delay: 1

  - id: temporal_impulse
    name: Temporal Impulse
    description: "The caster steals a sliver of an enemy's lost pace and keeps it ready; When this caster applies a SPD reduction, stores one Impulse for 2 turns. Their next Spatium skill consumes it to gain +10 ACC or reduce its cooldown by 1 turn; cannot stack."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
        - haste
        - slowness
    targeting: any_one
    kind: utility
    costs:
      mana: 8
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: temporal_impulse_effect
        status_effect: Impulse
        apply_to: self
        turns: 2
        polarity: positive
        next_action_bonus:
          element: spatium
          accuracy: 10
          cooldown: 1

  - id: stasis
    name: Stasis
    description: "The caster holds an ally in a still, protected instant; Suspends the target for 1 turn: they cannot act or move, and cannot receive damage or new statuses. Their cooldowns and timed effects do not advance during suspension."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 2
    learning_requirements:
      required_attack_ids:
        - time
    targeting: any_one
    kind: utility
    costs:
      mana: 8
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: stasis_effect
        status_effect: Stasis
        apply_to: target
        turns: 1
        polarity: positive
        suspend:
          invulnerable: true
          defer_damage: false
          defer_statuses: false
          freeze_cooldowns: true
          freeze_effects: true

  - id: time_lock
    name: Time Lock
    description: "The caster suspends an ally in a guarded instant; Suspends them for 1 turn: they cannot act or move, while attacks may target them but damage is deferred until suspension ends. Cooldowns and timed effects do not advance; new statuses are deferred with damage."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
        - stasis
    targeting: any_one
    kind: utility
    costs:
      mana: 12
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: time_lock_effect
        status_effect: Time Lock
        apply_to: target
        turns: 1
        polarity: positive
        suspend:
          invulnerable: false
          defer_damage: true
          defer_statuses: true
          freeze_cooldowns: true
          freeze_effects: true

  - id: anchor
    name: Anchor
    description: "The caster marks their own place in the moment; The mark remains until triggered. If the bearer attempts to use another skill or change lanes, the mark is consumed and that action is cancelled, costing their turn."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 2
    learning_requirements:
      required_attack_ids:
        - time
    targeting: self
    kind: buff
    costs:
      mana: 5
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: anchor_effect
        status_effect: Anchored
        apply_to: self
        turns: null
        polarity: positive
        anchor:
          cancel_actions: true

  - id: echo_mark
    name: Echo Mark
    description: "The caster marks an enemy's moment to remember its next wound; For 2 turns, records a fraction (20%) of the next damage the target takes, then deals that amount as a second impact at turn end. Consumed when it triggers; does not record damage from other echoes."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 2
    learning_requirements:
      required_attack_ids:
        - time
    targeting: any_one
    kind: utility
    costs:
      mana: 5
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: echo_mark_effect
        status_effect: Echo Mark
        apply_to: target
        turns: 2
        polarity: negative
        echo_mark:
          percent: 20
          resolve: turn_end

  - id: echoing_wound
    name: Echoing Wound
    description: "The caster strikes an enemy and leaves a lingering echo; Marks the target for 2 turns. The next attack to hit records 20% of its damage, with later hits before resolution adding 10% each up to 40% total; the echo resolves at turn end and is then consumed. Echo damage cannot trigger another echo."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
        - echo_mark
    targeting: any_one
    kind: attack
    damage:
      kind: magical
      damage_type: magical
      power:
        kind: fixed
        value: 5
    accuracy: 95
    hit_count: 1
    costs:
      mana: 8
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: echoing_wound_effect
        status_effect: Echoing Wound
        apply_to: target
        turns: 2
        polarity: negative
        echo_mark:
          percent: 20
          max_percent: 40
          add_percent_per_hit: 10
          resolve: turn_end

  - id: delayed_echo
    name: Delayed Echo
    description: "The caster sends a wound forward through time; Records 35% of this skill's damage against the target and repeats it at the start of the caster's next turn. It dissipates if the target leaves combat; it cannot critically hit or reapply the original skill's statuses."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 4
    learning_requirements:
      required_attack_ids:
        - echoing_wound
    targeting: any_one
    kind: attack
    damage:
      kind: magical
      damage_type: magical
      power:
        kind: fixed
        value: 7
    accuracy: 90
    hit_count: 1
    costs:
      mana: 11
      stamina: 0
      cooldown: 0
    effects:
