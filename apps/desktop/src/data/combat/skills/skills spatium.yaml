  - id: blink_strike
    name: Blink Strike
    description: "The caster vanishes and reappears beside an enemy with a sudden strike; Makes a normal physical attack that ignores Evasion and ordinary dodge checks, cannot critically hit, and fails at reduced cost if the target changes position before resolution."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 1
    learning_requirements:
      required_attack_ids:
        - space
    targeting: any_one
    kind: attack
    damage:
      kind: physical
      damage_type: physical
      power:
        kind: fixed
        value: 8
    accuracy: 100
    hit_count: 1
    ignore_evasion: true
    cannot_crit: true
    fail_if_target_moves: true
    fail_cost_fraction: 0.5
    costs:
