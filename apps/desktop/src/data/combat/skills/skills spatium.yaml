          cleanse: true

  - id: fixed_rewind
    name: Fixed Rewind
    description: "The caster restores an ally to the moment they were strongest; Once applied, restores the target to their state from 1 turn earlier for the rest of combat, including health, resources and statuses; can revive a defeated ally."
    element_id: spatium
    sfx: spatium
    learning_cost:
