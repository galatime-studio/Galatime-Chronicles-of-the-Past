skills:
  - id: time
    name: Time
    description: "The caster quickens their sense of time, moving faster and evading more easily; Grants +4 SPD and +5 Evasion for 2 turns."
    element_id: spatium
    sfx: spatium
    learning_cost:
      experience_points: 1
    learning_requirements:
      required_attack_ids: []
    targeting: self
    kind: buff
    costs:
      mana: 2
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: time_effect
        status_effect: Quickened
        apply_to: self
        turns: 2
        polarity: positive
        buff:
          speed: 4
          evasion: 5

  - id: haste
    name: Haste
    description: "The caster hastens an ally; Grants +8 SPD for 2 turns."
    element_id: spatium
    sfx: spatium
