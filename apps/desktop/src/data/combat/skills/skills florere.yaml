
skills:
  - id: bloom
    name: Bloom
    description: "The caster grows a healing bloom over an ally, restoring 22 HP at the start of each of the next 3 turns."
    element_id: florere
    sfx: florere
    kind: heal
    learning_requirements: { required_attack_ids: [] }
    learning_cost: { experience_points: 1 }
    targeting: any_one
    costs: { mana: 6, stamina: 0, cooldown: 0 }
    effects:
      - effect_id: bloom_hot
        status_effect: Bloom
        apply_to: target
        turns: 3
        polarity: positive
        regen_per_turn: { hp: 22 }

  - id: cleansing_pollen
