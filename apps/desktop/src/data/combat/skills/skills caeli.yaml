  - id: galeforce_shove
    name: Galeforce Shove
    description: "The caster gains SPD until the end of the round; If they act before the target, pushes them from the front line to the rear line; if the target is already in the rear line, their action is postponed. Does not deal damage."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
