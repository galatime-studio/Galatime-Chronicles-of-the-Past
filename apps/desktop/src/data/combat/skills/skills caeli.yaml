          physical_defense: 10
 
  - id: storm_of_blades
    name: Storm of Blades
    description: "A swirling gale of edges that rakes every enemy; Combines rapid cuts with heavy wind-edges for area pressure."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 6
    learning_requirements:
      required_attack_ids:
        - tempest_flurry
        - cutting_gale
    targeting: enemies_all
    kind: attack
    damage:
      kind: magical
      damage_type: magical
      power:
        kind: fixed
        value: 6
    accuracy: 90
    hit_count: 4
    costs:
      mana: 18
      stamina: 0
      cooldown: 0

  - id: tailwind
    name: Tailwind
    description: "The caster rides a tailwind forward in the turn order; Gains SPD +12 for 2 turns, and if they act before the target, pushes the target to the back row (if there is space)."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 1
    learning_requirements:
      required_attack_ids:
        - wind
    targeting: any_one
    kind: buff
    costs:
      mana: 5
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: tailwind_effect
        status_effect: Tailwind
        apply_to: self
        turns: 2
        polarity: positive
        buff:
          speed: 12
      - effect_id: tailwind_push_effect
        apply_to: target
        move:
          who: target
          to_line: rear
          condition:
            requires_pending: true

  - id: cloudstep
    name: Cloudstep
    description: "Ride the wind: SPD +14 for 2 turns and the caster may change lanes freely."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 4
    learning_requirements:
      required_attack_ids:
        - tailwind
    targeting: self
    kind: utility
    costs:
      mana: 9
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: cloudstep_effect
        status_effect: Cloudstep
        apply_to: self
        turns: 2
        polarity: positive
        buff:
          speed: 14
        lane_change_free: true

  - id: updraft
    name: Updraft
    description: "The caster uses the wind to evade attacks; Gains EVASION +8 until their next action."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 1
    learning_requirements:
      required_attack_ids:
