  - id: tornado
    name: Tornado
    description: "Tears a funnel cloud across the enemies' formation: heavy magical damage to all of them, and the wind drags enemies toward the front line wherever there is room."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 7
    learning_requirements:
      required_attack_ids:
        - storm
        - tempest_flurry
    targeting: enemies_all
    kind: attack
    costs:
      mana: 24
      stamina: 0
      cooldown: 0
    damage:
      kind: magical
      damage_type: magical
      power:
        kind: fixed
        value: 32
    accuracy: 80
    effects:
      - effect_id: tornado_drag_effect
        apply_to: enemies_all
        move:
          who: target
          to_line: front

  - id: sky_lift
    name: Sky Lift
    description: "The wind scoops an ally and carries them to the rear line without spending their turn. If the rear line is full, they instead brace mid-air (EVA +8) until their next action."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 1
    learning_requirements:
      required_attack_ids:
        - sky
    targeting: any_one
    kind: utility
    costs:
      mana: 6
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: sky_lift_brace_effect
        status_effect: Updraft
        apply_to: target
        turns: 2
        polarity: positive
        buff:
          evasion: 8
        expires: turn_start
        condition:
          requires_no_space: rear
      - effect_id: sky_lift_move_effect
        apply_to: target
        move:
          who: target
          to_line: rear

  - id: air_current
    name: Air Current
    description: "Raises a wall of moving air around the enemies for 2 turns: while it stands, they cannot cross lines with switch_line."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 2
    learning_requirements:
      required_attack_ids:
        - sky_lift
    targeting: enemies_all
    kind: utility
    costs:
      mana: 8
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: air_current_effect
        status_effect: Air Current
        apply_to: enemies_all
        turns: 2
        polarity: negative
        prevent_actions:
          - switch_line

  - id: sky_zone
    name: Sky Zone
    description: "Couples the enemies to the unstable sky for 2 turns (does not reach whoever already used their turn): SPD −8 and switching lines is cancelled while the zone stands."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
        - air_current
    targeting: enemies_all
    kind: control
    costs:
      mana: 10
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: sky_zone_effect
        status_effect: Sky Zone
        apply_to: enemies_all
        turns: 2
        polarity: negative
        debuff:
          speed: 8
        condition:
          requires_pending: true
        prevent_actions:
          - switch_line

  - id: gale_resonance
    name: Gale Resonance
    description: "Tunes the team to the gale for 3 turns: SPD +10, and Caeli skills used by the bearer have 15% stronger effects."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 5
    learning_requirements:
      required_attack_ids:
        - cloudstep
    targeting: allies_all
    kind: buff
    costs:
      mana: 18
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: gale_resonance_effect
        status_effect: Gale Resonance
        apply_to: allies_all
        turns: 3
        polarity: positive
        buff:
          speed: 10
        element_power:
          caeli: 1.15

  - id: ranged_veil
    name: Ranged Veil
    description: "Spreads a veil through the caster's lane that lasts until each veiled ally acts: thrown and long-reach weapons and spells aimed at them find them 15 points harder to hit."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 4
    learning_requirements:
      required_attack_ids:
        - sky_zone
        - gale_resonance
    targeting: any_one
    kind: buff
    costs:
      mana: 12
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: ranged_veil_effect
        status_effect: Ranged Veil
        apply_to: allies_lane
        turns: 2
        polarity: positive
        ranged_evasion: 15
        expires: turn_end

  - id: blackout
    name: Blackout
    description: "Smothers the light for 3 rounds: solar boosts are suppressed and Lux skills drop to 90% of their effect while it lasts."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 5
    learning_requirements:
      required_attack_ids:
        - cloudy
    targeting: self
    kind: debuff
    costs:
      mana: 18
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: blackout_effect
        apply_to: self
        block_solar: true
        phase_rounds: 3
        weather:
          rounds: 3
          element_effect_multipliers:
            lux: 0.9

  - id: pressure_crush
    name: Pressure Crush
    description: "Focuses the sky's weight onto every enemy for 2 turns: SPD −8 and MAG −10."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 5
    learning_requirements:
      required_attack_ids:
        - sky_zone
    targeting: enemies_all
    kind: debuff
    costs:
      mana: 16
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: pressure_crush_effect
        status_effect: Pressured
        apply_to: enemies_all
        turns: 2
        polarity: negative
        debuff:
          speed: 8
          magical_attack: 10

  - id: skyline_sight
    name: Skyline Sight
    description: "Grants the target a thrower's eye for 3 turns: thrown weapons and long-reach attacks gain ACC +12 (spells and melee do not benefit)."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 2
    learning_requirements:
      required_attack_ids:
        - sky
    targeting: any_one
    kind: buff
    costs:
      mana: 8
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: skyline_sight_effect
        status_effect: Skyline Sight
        apply_to: target
        turns: 3
        polarity: positive
        projectile_accuracy:
          amount: 12

  - id: tailwind_trajectory
    name: Tailwind Trajectory
    description: "Reads the currents for the whole team for 3 turns: thrown weapons and long-reach attacks aimed at enemies in the rear lane gain ACC +18."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 4
    learning_requirements:
      required_attack_ids:
        - skyline_sight
    targeting: allies_all
    kind: buff
    costs:
      mana: 14
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: tailwind_trajectory_effect
        status_effect: Tailwind Trajectory
        apply_to: allies_all
        turns: 3
        polarity: positive
        projectile_accuracy:
          amount: 18
          vs_lane: rear

  - id: crosswind_mark
    name: Crosswind Mark
    description: "Charts crossing streams over the target for 2 turns: thrown weapons and long-reach attacks aimed at them gain ACC +15."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 4
    learning_requirements:
      required_attack_ids:
        - tailwind_trajectory
    targeting: any_one
    kind: buff
    costs:
      mana: 14
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: crosswind_mark_effect
        status_effect: Crosswind Mark
        apply_to: target
        turns: 2
        polarity: positive
        projectile_mark:
          accuracy: 15

  - id: second_chance
    name: Second Chance
    description: "Covers the caster in wind that carries missed shots back on course. For 2 turns, the first thrown or long-reach, single-hit attack that misses each round is re-thrown once at the same target with no extra cost."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 6
    learning_requirements:
      required_attack_ids:
        - tailwind_trajectory
        - crosswind_mark
    targeting: self
    kind: utility
    costs:
      mana: 20
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: second_chance_effect
        status_effect: Second Chance
        apply_to: self
        turns: 2
        polarity: positive
        projectile_reroll:
          per_turn: 1
