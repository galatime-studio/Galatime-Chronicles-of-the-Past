        status_effect: Windborne
        apply_to: target
        turns: 3
        polarity: positive
        lane_change_free: true

  - id: zephyr_veil
    name: Zephyr Veil
    description: "The caster sends a gentle breeze around the bearer, helping them avoid attacks; Grants SPD +8 and EVASION +12 for 2 turns, After an entity misses the bearer, the bearer will move to the other line without using a turn (and the effect breaks)."
    element_id: caeli
    sfx: caeli
    learning_cost:
      experience_points: 3
    learning_requirements:
      required_attack_ids:
        - updraft
    targeting: any_one
    kind: buff
    costs:
      mana: 10
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: zephyr_veil_effect
        status_effect: Zephyr Veil
        apply_to: target
        turns: 2
        polarity: positive
        buff:
          speed: 8
          evasion: 12
        on_miss_move:
          who: self
          to_line: other
          break_after: true

  - id: slipstream
