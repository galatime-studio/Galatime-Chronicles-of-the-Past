      stamina: 0
      cooldown: 0
    effects:
      - effect_id: updraft_effect
        status_effect: Updraft
        apply_to: self
        turns: 2
        polarity: positive
        buff:
          evasion: 8
        expires: turn_start

  - id: windborne
    name: Windborne
    description: "The caster marks an ally with a guiding wind; The marked ally may move to the other line freely while the status lives."
    element_id: caeli
    sfx: caeli
    learning_cost:
