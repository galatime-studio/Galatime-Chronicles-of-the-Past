    targeting: both_teams
    kind: buff
    costs:
      mana: 14
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: slipstream_effect
        status_effect: Slipstream
        apply_to: allies_all
        turns: 1
        polarity: positive
        buff:
          speed: 14
      - effect_id: slipstream_headwind_effect
        status_effect: Headwind
        apply_to: enemies_all
        turns: 1
        polarity: negative
        debuff:
          speed: 6

  - id: eye_of_the_storm
    name: Eye of the Storm
    description: "The caster concentrates the wind in his direction, helping him in speed and accuracy; SPD +18, MATK +8 and ACC +10% for 3 turns."
