    targeting: any_one
    kind: control
    costs:
      mana: 7
      stamina: 0
      cooldown: 0
    effects:
      - effect_id: galeforce_shove_stall_effect
        apply_to: target
        turn_postpone:
          slots: 1
          condition:
            requires_pending: true
            target_line: rear
      - effect_id: galeforce_shove_effect
        status_effect: Gale Stance
        apply_to: self
        turns: 2
        polarity: positive
        buff:
          speed: 12
        expires: round_end
      - effect_id: galeforce_shove_push_effect
        apply_to: target
        move:
          who: target
          to_line: rear
          condition:
            requires_pending: true
